name: Publish Helm Chart

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "*.*.*"
    paths:
      - charts/odoo/**
      - .github/workflows/helm-chart.yml
  pull_request:
    paths:
      - charts/odoo/**
      - .github/workflows/helm-chart.yml
  workflow_dispatch:

env:
  CHART_PATH: charts/odoo

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint "$CHART_PATH" \
            --set odoo.config.dbHost=postgres.example \
            --set odoo.config.dbUser=odoo \
            --set odoo.config.dbPassword=dummy

  publish:
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Prepare chart metadata
        id: meta
        shell: bash
        run: |
          chart_name="$(helm show chart "$CHART_PATH" | awk '/^name:/ {print $2}')"
          base_version="$(helm show chart "$CHART_PATH" | awk '/^version:/ {print $2}')"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            package_version="${base_version}"
          else
            package_version="${base_version}-dev.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi

          echo "chart_name=${chart_name}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check if chart version already exists
        id: exists
        run: |
          if helm show chart "oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts/${{ steps.meta.outputs.chart_name }}" --version "${{ steps.meta.outputs.package_version }}" >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package chart
        if: steps.exists.outputs.already_published != 'true'
        run: |
          mkdir -p dist
          helm package "$CHART_PATH" \
            --version "${{ steps.meta.outputs.package_version }}" \
            --destination dist

      - name: Push chart to GHCR OCI
        if: steps.exists.outputs.already_published != 'true'
        run: |
          helm push "dist/${{ steps.meta.outputs.chart_name }}-${{ steps.meta.outputs.package_version }}.tgz" \
            "oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts"

      - name: Skip existing chart publish
        if: steps.exists.outputs.already_published == 'true'
        run: echo "Chart ${{ steps.meta.outputs.chart_name }}:${{ steps.meta.outputs.package_version }} already exists. Skipping publish."

      - name: Verify published chart is retrievable
        run: |
          chart_ref="oci://ghcr.io/${{ steps.meta.outputs.owner }}/charts/${{ steps.meta.outputs.chart_name }}"
          chart_version="${{ steps.meta.outputs.package_version }}"

          helm show chart "$chart_ref" --version "$chart_version"
          mkdir -p verify
          helm pull "$chart_ref" --version "$chart_version" --destination verify
          ls -l verify
