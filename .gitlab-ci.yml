stages:
  - build
  - publish

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/odoo"

container-build:
  stage: build
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$IMAGE_NAME:$IMAGE_TAG" .
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
        docker push "$IMAGE_NAME:$IMAGE_TAG"
      fi
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ] && { [ -n "$CI_COMMIT_TAG" ] || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; }; then
        docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      fi

helm-chart-publish:
  stage: publish
  image: alpine/helm:3.16.4
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - charts/odoo/**/*
        - .gitlab-ci.yml
  script:
    - helm lint charts/odoo --set odoo.config.dbHost=postgres.example --set odoo.config.dbUser=odoo --set odoo.config.dbPassword=dummy
    - echo "$CI_REGISTRY_PASSWORD" | helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - CHART_NAME="$(helm show chart charts/odoo | awk '/^name:/ {print $2}')"
    - BASE_CHART_VERSION="$(helm show chart charts/odoo | awk '/^version:/ {print $2}')"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        PACKAGE_VERSION="$BASE_CHART_VERSION"
      else
        PACKAGE_VERSION="${BASE_CHART_VERSION}-dev.${CI_PIPELINE_ID}"
      fi
    - |
      if helm show chart "oci://$CI_REGISTRY_IMAGE/charts/$CHART_NAME" --version "$PACKAGE_VERSION" >/dev/null 2>&1; then
        echo "Chart ${CHART_NAME}:${PACKAGE_VERSION} already exists in registry. Skipping publish."
        exit 0
      fi
    - mkdir -p /tmp/charts
    - helm package charts/odoo --version "$PACKAGE_VERSION" --destination /tmp/charts
    - helm push "/tmp/charts/${CHART_NAME}-${PACKAGE_VERSION}.tgz" "oci://$CI_REGISTRY_IMAGE/charts"
